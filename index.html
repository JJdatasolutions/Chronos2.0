<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entraînement Vocabulaire</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4776E6;
            --secondary: #8E54E9;
            --success: #2ecc71;
            --danger: #ff4757;
            --bg-gradient: linear-gradient(135deg, #4776E6 0%, #8E54E9 100%);
            --text-main: #2d3436;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 850px;
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            position: relative;
            text-align: center;
        }

        h1 { color: var(--primary); font-weight: 800; font-size: 2.2rem; margin-bottom: 5px; }
        p.subtitle { color: #636e72; font-size: 1.1rem; margin-bottom: 30px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }

        select, input[type="number"] {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid #dfe6e9;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        select:focus, input[type="number"]:focus { outline: none; border-color: var(--secondary); }

        .btn {
            background: var(--bg-gradient);
            color: white; border: none; padding: 15px 30px; font-size: 18px; font-weight: 600;
            border-radius: 50px; cursor: pointer; box-shadow: 0 10px 20px rgba(71, 118, 230, 0.3);
            transition: transform 0.2s; font-family: 'Poppins', sans-serif;
        }
        .btn:hover { transform: translateY(-3px); }
        .btn-outline { background: transparent; color: var(--text-main); border: 2px solid #dfe6e9; box-shadow: none; }
        .btn-danger { background: var(--danger); box-shadow: 0 10px 20px rgba(255, 71, 87, 0.3); }

        .screen { display: none; }
        .active-screen { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        #word-display { font-size: 4.5rem; font-weight: 800; color: var(--primary); margin: 50px 0; min-height: 120px; display: flex; align-items: center; justify-content: center; }
        #timer-container { width: 100%; height: 16px; background: #dfe6e9; border-radius: 8px; overflow: hidden; margin: 20px 0; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 1s linear, background-color 0.5s; }
        #info-header { font-weight: 600; color: #b2bec3; font-size: 1.2rem; }

        .results-table-container { max-height: 400px; overflow-y: auto; border-radius: 12px; border: 1px solid #dfe6e9; margin: 25px 0; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid #dfe6e9; font-size: 1.1rem; }
        th { background: #f8f9fa; font-weight: 600; position: sticky; top: 0; }
        td:first-child { font-weight: 600; }
        td:last-child { color: var(--secondary); font-weight: 800; }

        .admin-link { position: absolute; top: 20px; right: 25px; color: #b2bec3; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
        .admin-link:hover { color: var(--primary); }
        .flex-buttons { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <a href="docent.html" class="admin-link">⚙️ Accès Professeur</a>

    <!-- Écran 1: Menu de sélection -->
    <div id="menu-screen" class="screen active-screen">
        <h1>Entraînement Vocabulaire</h1>
        <p class="subtitle">Prêt à apprendre ? Configurez votre session.</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; text-align: left; margin-bottom: 30px;">
            <div class="form-group" style="margin: 0;">
                <label>1. Classe</label>
                <select id="klas-select" onchange="laadTrajecten()">
                    <option value="">-- Sélectionner --</option>
                </select>
            </div>
            
            <div class="form-group" style="margin: 0;">
                <label>2. Trajet</label>
                <select id="traject-select" onchange="laadSeries()">
                    <option value="">-- Sélectionner --</option>
                </select>
            </div>

            <div class="form-group" style="margin: 0;">
                <label>3. Série</label>
                <select id="serie-select">
                    <option value="">-- Sélectionner --</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="max-width: 300px; margin: 0 auto 30px auto;">
            <label style="text-align: center;">⏱️ Temps par mot (secondes)</label>
            <input type="number" id="time-input" value="8" min="2" max="60">
        </div>

        <button class="btn" onclick="startOefening()">🚀 Commencer l'exercice</button>
    </div>

    <!-- Écran 2: Exercice en cours -->
    <div id="exercise-screen" class="screen">
        <div id="info-header"></div>
        <div id="timer-container"><div id="timer-bar"></div></div>
        <div id="word-display">Chargement...</div>
        
        <div class="flex-buttons">
            <button id="pause-btn" class="btn btn-outline" onclick="togglePause()">⏸️ Pause</button>
            <button class="btn btn-danger" onclick="location.reload()">🛑 Arrêter</button>
        </div>
    </div>

    <!-- Écran 3: Résultats -->
    <div id="result-screen" class="screen">
        <h1 style="color: var(--success); font-size: 2.5rem;">Fini !</h1>
        <p class="subtitle">L'exercice est terminé.</p>
        
        <button id="show-solution-btn" class="btn" style="margin-bottom: 20px;" onclick="toonOplossingen()">👀 Afficher la solution</button>

        <div id="solution-container" style="display: none;">
            <div class="results-table-container">
                <table id="res-body"></table>
            </div>
            <button class="btn btn-outline" onclick="location.reload()">🏠 Retour au menu</button>
        </div>
    </div>
</div>

<script>
    let database = JSON.parse(localStorage.getItem('pelckmans_custom_db')) || [];
    let actieveLijst = [];
    let wordIdx = 0, timeLeft = 8, maxTime = 8, isPaused = false, interval;

    window.onload = () => {
        let klassen = [...new Set(database.map(item => item.klas))];
        let klasSelect = document.getElementById('klas-select');
        klassen.forEach(k => klasSelect.innerHTML += `<option value="${k}">${k}</option>`);
    };

    function laadTrajecten() {
        let gekozenKlas = document.getElementById('klas-select').value;
        let trajectSelect = document.getElementById('traject-select');
        document.getElementById('serie-select').innerHTML = '<option value="">-- Sélectionner --</option>';
        trajectSelect.innerHTML = '<option value="">-- Sélectionner --</option>';
        
        let relevanteLijsten = database.filter(item => item.klas === gekozenKlas);
        relevanteLijsten.forEach(item => {
            trajectSelect.innerHTML += `<option value="${item.id}">${item.traject}</option>`;
        });
    }

    function laadSeries() {
        let id = document.getElementById('traject-select').value;
        let serieSelect = document.getElementById('serie-select');
        serieSelect.innerHTML = '<option value="">-- Sélectionner --</option>';
        
        if (!id) return;
        let item = database.find(i => i.id == id);
        
        if(item && item.series) {
            item.series.forEach((serie, index) => {
                serieSelect.innerHTML += `<option value="${index}">Série ${index + 1} (${serie.length} mots)</option>`;
            });
        }
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    function startOefening() {
        let id = document.getElementById('traject-select').value;
        let serieIdx = document.getElementById('serie-select').value;
        maxTime = parseInt(document.getElementById('time-input').value);

        if (!id || serieIdx === "") return alert("Veuillez choisir un trajet et une série !");
        if (!maxTime || maxTime < 1) return alert("Veuillez définir un temps valide.");
        
        let gekozenItem = database.find(item => item.id == id);
        // We nemen de vaste série, maar shuffelen de woorden binnen de série voor het oefenen
        actieveLijst = shuffle([...gekozenItem.series[serieIdx]]);
        
        switchScreen('exercise-screen');
        nextWord();
    }

    function nextWord() {
        if (wordIdx >= actieveLijst.length) return eindScherm();
        
        timeLeft = maxTime;
        isPaused = false;
        document.getElementById('pause-btn').innerHTML = "⏸️ Pause";
        document.getElementById('word-display').innerText = actieveLijst[wordIdx].nl;
        document.getElementById('info-header').innerText = `Mot ${wordIdx + 1} sur ${actieveLijst.length}`;
        updateTimerBar();

        if (interval) clearInterval(interval);
        interval = setInterval(() => {
            if (!isPaused) {
                timeLeft--; 
                updateTimerBar();
                if (timeLeft <= 0) { 
                    wordIdx++; 
                    nextWord(); 
                }
            }
        }, 1000);
    }

    function updateTimerBar() {
        let bar = document.getElementById('timer-bar');
        let percentage = (timeLeft / maxTime) * 100;
        bar.style.width = percentage + "%";
        
        if (percentage <= 25) bar.style.background = "var(--danger)";
        else if (percentage <= 50) bar.style.background = "#f1c40f";
        else bar.style.background = "var(--success)";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerHTML = isPaused ? "▶️ Reprendre" : "⏸️ Pause";
    }

    function eindScherm() {
        clearInterval(interval);
        switchScreen('result-screen');
        
        let resBody = document.getElementById('res-body');
        resBody.innerHTML = `<tr><th>Néerlandais</th><th>Français</th></tr>` + 
        actieveLijst.map(w => `
            <tr>
                <td>${w.nl}</td>
                <td>${w.fr}</td>
            </tr>
        `).join('');
    }

    function toonOplossingen() {
        document.getElementById('show-solution-btn').style.display = 'none';
        document.getElementById('solution-container').style.display = 'block';
    }
</script>

</body>
</html>
