<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Entraînement Vocabulaire</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #121212; --card: #1e1e1e; --accent: #f1c40f; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center;}
        #container { width: 95%; max-width: 1100px; margin: 40px auto; }
        .selector-container { background: var(--card); padding: 25px; border-radius: 12px; margin-bottom: 30px; display: flex; justify-content: center; gap: 15px; }
        select, button { padding: 12px; background: #333; color: white; border-radius: 6px; border: 1px solid var(--primary); font-size: 16px; cursor: pointer; }
        button { background: var(--primary); border: none; font-weight: bold; }
        .screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        #word-display { font-size: 60px; font-weight: bold; margin: 40px 0; color: var(--accent); }
        #timer-container { width: 70%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-bottom:20px; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 1s linear; }
        table { margin: 0 auto; border-collapse: collapse; width: 80%; }
        td { padding: 15px; border-bottom: 1px solid #444; font-size: 24px;}
        .admin-link { position: absolute; top: 10px; right: 10px; color: #888; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<a href="docent.html" class="admin-link">⚙️ Docenten Login</a>

<div id="container">
    <h1>Entraînement Vocabulaire</h1>
    <div class="selector-container">
        <select id="klas-select" onchange="laadTrajecten()"><option value="">-- Kies Klas --</option></select>
        <select id="traject-select"><option value="">-- Kies Traject --</option></select>
        <button onclick="startOefening()">Start</button>
    </div>
</div>

<div id="exercise" class="screen">
    <div id="info-header" style="color: #aaa; margin-bottom: 20px;"></div>
    <div id="timer-container"><div id="timer-bar"></div></div>
    <div id="word-display">Chargement...</div>
    <div>
        <button id="pause-btn" style="background:#555;" onclick="togglePause()">Pause</button>
        <button style="background:var(--danger);" onclick="location.reload()">Stop</button>
    </div>
</div>

<div id="result" class="screen" style="overflow-y:auto; padding:50px 0;">
    <h2 style="color: var(--success);">Klaar!</h2>
    <table id="res-body"></table>
    <button style="margin-top: 30px;" onclick="location.reload()">Terug naar menu</button>
</div>

<script>
    let database = JSON.parse(localStorage.getItem('pelckmans_custom_db')) || [];
    let actieveLijst = [];
    let wordIdx = 0, timeLeft = 8, isPaused = false, interval;

    // Populeer klassen
    window.onload = () => {
        let klassen = [...new Set(database.map(item => item.klas))];
        let klasSelect = document.getElementById('klas-select');
        klassen.forEach(k => klasSelect.innerHTML += `<option value="${k}">${k}</option>`);
    };

    function laadTrajecten() {
        let gekozenKlas = document.getElementById('klas-select').value;
        let trajectSelect = document.getElementById('traject-select');
        trajectSelect.innerHTML = '<option value="">-- Kies Traject --</option>';
        
        let relevanteLijsten = database.filter(item => item.klas === gekozenKlas);
        relevanteLijsten.forEach(item => {
            trajectSelect.innerHTML += `<option value="${item.id}">${item.traject}</option>`;
        });
    }

    // Shuffle functie
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startOefening() {
        let id = document.getElementById('traject-select').value;
        if (!id) return alert("Kies een traject!");
        
        let gekozenItem = database.find(item => item.id == id);
        actieveLijst = shuffle([...gekozenItem.woorden]);
        
        document.getElementById('container').style.display = 'none';
        document.getElementById('exercise').style.display = 'flex';
        nextWord();
    }

    function nextWord() {
        if (wordIdx >= actieveLijst.length) return eindScherm();
        
        timeLeft = 8; isPaused = false;
        document.getElementById('word-display').innerText = actieveLijst[wordIdx].nl;
        document.getElementById('info-header').innerText = `Mot ${wordIdx+1}/${actieveLijst.length}`;
        updateTimerBar();

        if (interval) clearInterval(interval);
        interval = setInterval(() => {
            if (!isPaused) {
                timeLeft--; updateTimerBar();
                if (timeLeft <= 0) { wordIdx++; nextWord(); }
            }
        }, 1000);
    }

    function updateTimerBar() {
        let bar = document.getElementById('timer-bar');
        bar.style.width = (timeLeft / 8 * 100) + "%";
        bar.style.background = timeLeft <= 2 ? "var(--danger)" : "var(--success)";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "Hervatten" : "Pause";
    }

    function eindScherm() {
        clearInterval(interval);
        document.getElementById('exercise').style.display = 'none';
        document.getElementById('result').style.display = 'flex';
        
        let resBody = document.getElementById('res-body');
        resBody.innerHTML = actieveLijst.map(w => `
            <tr>
                <td style="width:50%;">${w.nl}</td>
                <td style="color:var(--primary); font-weight:bold;">${w.fr}</td>
            </tr>
        `).join('');
    }
</script>

</body>
</html>
