<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Entraînement Vocabulaire</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --danger: #e74c3c; --bg: #121212; --card: #1e1e1e; --accent: #f1c40f; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 40px auto; background: var(--card); padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); position: relative; min-height: 400px; display: flex; flex-direction: column; justify-content: center; }
        select, button { padding: 12px; margin: 10px; background: #333; color: white; border-radius: 6px; border: 1px solid var(--primary); font-size: 16px; cursor: pointer; }
        button { background: var(--primary); border: none; font-weight: bold; transition: 0.2s; }
        button:hover { filter: brightness(1.2); }
        .btn-secondary { background: #555; border: none; }
        .btn-danger { background: var(--danger); border: none; }
        
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
        .active-screen { display: flex; }
        
        #word-display { font-size: 55px; font-weight: bold; margin: 40px 0; color: var(--accent); }
        #timer-container { width: 100%; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-bottom: 20px; }
        #timer-bar { width: 100%; height: 100%; background: var(--success); transition: width 1s linear; }
        
        table { margin: 20px auto; border-collapse: collapse; width: 100%; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #444; font-size: 22px; }
        .admin-link { position: absolute; top: 15px; right: 20px; color: #888; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .admin-link:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    <a href="docent.html" class="admin-link">⚙️ Accès Professeur</a>

    <!-- Écran 1: Menu de sélection -->
    <div id="menu-screen" class="screen active-screen">
        <h1 style="margin-bottom: 10px;">Entraînement Vocabulaire</h1>
        <p style="color: #aaa; margin-bottom: 30px;">Sélectionnez votre classe et votre trajet pour commencer.</p>
        
        <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; width: 100%;">
            <select id="klas-select" onchange="laadTrajecten()" style="flex: 1; min-width: 200px;">
                <option value="">-- Choisir la Classe --</option>
            </select>
            <select id="traject-select" style="flex: 1; min-width: 200px;">
                <option value="">-- Choisir le Trajet --</option>
            </select>
        </div>
        <button onclick="startOefening()" style="width: 200px; margin-top: 20px; font-size: 18px;">🚀 Commencer</button>
    </div>

    <!-- Écran 2: Exercice en cours -->
    <div id="exercise-screen" class="screen">
        <div id="info-header" style="color: #aaa; margin-bottom: 20px; font-size: 18px;"></div>
        <div id="timer-container"><div id="timer-bar"></div></div>
        <div id="word-display">Chargement...</div>
        <div style="display: flex; gap: 15px; margin-top: 20px;">
            <button id="pause-btn" class="btn-secondary" style="width: 140px;" onclick="togglePause()">Pause</button>
            <button class="btn-danger" style="width: 140px;" onclick="location.reload()">Arrêter</button>
        </div>
    </div>

    <!-- Écran 3: Résultats / Solutions -->
    <div id="result-screen" class="screen">
        <h2 style="color: var(--success); font-size: 32px;">Série terminée !</h2>
        <div style="max-height: 400px; overflow-y: auto; width: 100%; background: #2a2a2a; border-radius: 8px; padding: 10px;">
            <table id="res-body"></table>
        </div>
        <button style="margin-top: 25px; width: 250px;" onclick="location.reload()">Retour au menu</button>
    </div>
</div>

<script>
    let database = JSON.parse(localStorage.getItem('pelckmans_custom_db')) || [];
    let actieveLijst = [];
    let wordIdx = 0, timeLeft = 8, maxTime = 8, isPaused = false, interval;

    window.onload = () => {
        let klassen = [...new Set(database.map(item => item.klas))];
        let klasSelect = document.getElementById('klas-select');
        klassen.forEach(k => klasSelect.innerHTML += `<option value="${k}">${k}</option>`);
    };

    function laadTrajecten() {
        let gekozenKlas = document.getElementById('klas-select').value;
        let trajectSelect = document.getElementById('traject-select');
        trajectSelect.innerHTML = '<option value="">-- Choisir le Trajet --</option>';
        
        let relevanteLijsten = database.filter(item => item.klas === gekozenKlas);
        relevanteLijsten.forEach(item => {
            trajectSelect.innerHTML += `<option value="${item.id}">${item.traject}</option>`;
        });
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    function startOefening() {
        let id = document.getElementById('traject-select').value;
        if (!id) return alert("Veuillez choisir un trajet !");
        
        let gekozenItem = database.find(item => item.id == id);
        actieveLijst = shuffle([...gekozenItem.woorden]);
        maxTime = gekozenItem.temps || 8; // Récupère le temps personnalisé (ou 8 par défaut)
        
        switchScreen('exercise-screen');
        nextWord();
    }

    function nextWord() {
        if (wordIdx >= actieveLijst.length) return eindScherm();
        
        timeLeft = maxTime;
        isPaused = false;
        document.getElementById('pause-btn').innerText = "Pause";
        document.getElementById('word-display').innerText = actieveLijst[wordIdx].nl;
        document.getElementById('info-header').innerText = `Mot ${wordIdx + 1} / ${actieveLijst.length}`;
        updateTimerBar();

        if (interval) clearInterval(interval);
        interval = setInterval(() => {
            if (!isPaused) {
                timeLeft--; 
                updateTimerBar();
                if (timeLeft <= 0) { 
                    wordIdx++; 
                    nextWord(); 
                }
            }
        }, 1000);
    }

    function updateTimerBar() {
        let bar = document.getElementById('timer-bar');
        let percentage = (timeLeft / maxTime) * 100;
        bar.style.width = percentage + "%";
        
        // La barre devient rouge quand il reste 25% du temps (ex: 2s sur 8s, ou 5s sur 20s)
        bar.style.background = percentage <= 25 ? "var(--danger)" : "var(--success)";
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById('pause-btn').innerText = isPaused ? "Reprendre" : "Pause";
    }

    function eindScherm() {
        clearInterval(interval);
        switchScreen('result-screen');
        
        let resBody = document.getElementById('res-body');
        resBody.innerHTML = actieveLijst.map(w => `
            <tr>
                <td style="width:50%;">${w.nl}</td>
                <td style="color:var(--primary); font-weight:bold;">${w.fr}</td>
            </tr>
        `).join('');
    }
</script>

</body>
</html>
